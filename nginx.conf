# CertiMate 프론트 정적 서빙 + /api 리버스 프록시
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 백엔드로 프록시 (docker-compose 서비스명 backend:8080)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;   # JWT httpOnly 쿠키 전달
    }

    # 빌드 산출물은 파일명에 해시가 붙는다(index-C35YDIAZ.js).
    # 내용이 바뀌면 이름도 바뀌므로 오래 캐시해도 안전하다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html은 절대 캐시하면 안 된다.
    # 이 파일이 어떤 해시 번들을 부를지 가리키는 유일한 지점이라, 캐시되면
    # 배포를 해도 브라우저가 옛 번들을 계속 물고 있는다. 실제로 이것 때문에
    # 배포가 반영 안 된 것처럼 보이는 일이 반복됐다(2026-09-08).
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA 라우팅: 없는 경로는 index.html로
    location / {
        try_files $uri $uri/ /index.html;
    }
}
